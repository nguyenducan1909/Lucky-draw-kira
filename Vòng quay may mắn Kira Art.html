<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng quay may mắn Kira Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6D2;--star:#F6E3A0;--ink:#5B2F70;--purple:#8E54A0;--gold:#FDD835;--card:#fff;--chip:#fff;--muted:#7a5a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2E1838;--star:#3B2148;--ink:#FBF6D2;--card:#3F2350;--chip:#3F2350;--muted:#d8bfe6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2E1838;--star:#3B2148;--ink:#FBF6D2;--card:#3F2350;--chip:#3F2350;--muted:#d8bfe6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Arial,sans-serif;font-weight:600;
background-image:radial-gradient(circle at 20px 20px,var(--star) 0 6px,transparent 7px);background-size:64px 64px}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px;text-align:center}
h1{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.1;margin:8px 0 4px;color:var(--purple)}
.sub{margin:0 0 20px;color:var(--muted)}
.stage{--s:min(86vw,440px,56vh);position:relative;width:var(--s);height:var(--s);margin:18px auto 0}
.stage::before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;box-shadow:0 8px 0 rgba(91,47,112,.25)}
.wheel{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-transition:-webkit-transform 5.2s cubic-bezier(.12,.7,.12,1);transition:transform 5.2s cubic-bezier(.12,.7,.12,1);will-change:transform}
.wheel svg{display:block;width:100%;height:100%}
.pointer{position:absolute;left:50%;top:-14px;width:44px;height:52px;transform:translateX(-50%);z-index:3}
.hub{position:absolute;left:50%;top:50%;width:calc(var(--s)*.26);height:calc(var(--s)*.26);padding:0;transform:translate(-50%,-50%);border-radius:50%;border:6px solid #fff;background:var(--gold);color:#5B2F70;
font:800 clamp(18px,5vw,26px)/1 "Baloo 2","Trebuchet MS",sans-serif;cursor:pointer;z-index:2;box-shadow:0 4px 0 #B8960C}
.hub:hover:not(:disabled){background:#ffe45c}
.hub:active:not(:disabled){transform:translate(-50%,-48%);box-shadow:0 2px 0 #B8960C}
.hub:disabled{background:#d9cfe0;box-shadow:none;cursor:not-allowed}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.stock{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:26px auto 12px;max-width:420px;padding:0;list-style:none}
.stock li{background:var(--chip);border:2px solid var(--purple);border-radius:14px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px}
.stock li.out{opacity:.45;text-decoration:line-through}
.stock b{color:var(--purple);font-family:"Baloo 2",sans-serif;font-size:1.15em}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:6px}
.msg{min-height:1.4em;margin:12px 0 0;color:var(--muted)}
.kho{max-width:420px;margin:20px auto 0}
.kho summary{cursor:pointer;font-weight:800;color:var(--purple);padding:12px;min-height:44px;list-style:none;border:2px solid var(--purple);border-radius:999px;background:var(--chip)}
.kho summary::-webkit-details-marker{display:none}
.kho[open] summary{margin-bottom:12px}
.kho .stock{margin-top:0}
@media (max-width:480px){main{padding:12px 12px 28px}.sub{margin-bottom:8px}.pointer{width:38px;height:45px;top:-12px}}
dialog{border:0;border-radius:24px;padding:0;width:min(92vw,520px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(46,24,56,.5)}
dialog::backdrop{background:rgba(46,24,56,.6)}
.pop{padding:22px 18px 20px;text-align:center}
.pop h2{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(24px,6vw,32px);margin:0 0 4px;color:var(--purple)}
.pop p{margin:0 0 14px}
.pop img{width:100%;height:auto;border-radius:14px;display:block;margin:0 0 16px}
.btn{background:var(--purple);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:800 1.05rem "Baloo 2",sans-serif;cursor:pointer}
.btn:hover{background:#7a4290}
@media (prefers-reduced-motion:reduce){.wheel{transition-duration:1.2s}}
</style>
</head>
<body>
<main>
<h1>Vòng quay may mắn Kira Art</h1>
<p class="sub">Bấm nút giữa vòng quay để thử vận may của bạn.</p>
<div class="stage">
<svg class="pointer" viewBox="0 0 44 52" aria-hidden="true"><path d="M22 52 3 14C-2 4 6 0 22 0s24 4 19 14z" fill="#FDD835" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
<div class="wheel" id="wheelBox"><svg id="wheel" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Vòng quay gồm 4 ô: Móc khóa, Voucher 5%, Voucher 10%, Voucher 20%"></svg></div>
<button class="hub" id="spin" type="button">QUAY</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<details class="kho">
<summary>Xem số quà còn lại</summary>
<ul class="stock" id="stock" aria-label="Số quà còn lại"></ul>
<button class="link" id="reset" type="button">Đặt lại kho quà</button>
</details>
</main>
<dialog id="dlg" aria-labelledby="dt">
<div class="pop">
<h2 id="dt"></h2>
<p id="dd"></p>
<img id="di" alt="">
<button class="btn" id="close" type="button">Đóng</button>
</div>
</dialog>

const PRIZES=[
{id:"k",label:"Móc khóa",short:"Móc khóa",stock:50,w:60,fill:"#FDD835",text:"#5B2F70",title:"Bạn trúng móc khóa Kira Art!",desc:"Nhận ngay một móc khóa Kira.",alt:"Ba mẫu móc khóa Kira Art"},
{id:"p5",label:"5%",short:"Voucher 5%",stock:10,w:25,fill:"#8E54A0",text:"#FFFFFF",title:"Bạn trúng voucher 5%!",desc:"Áp dụng cho tất cả các khóa học tại Kira Art.",alt:"Voucher giảm 5%"},
{id:"p10",label:"10%",short:"Voucher 10%",stock:5,w:10,fill:"#FBEFA6",text:"#5B2F70",title:"Bạn trúng voucher 10%!",desc:"Áp dụng cho tất cả các khóa học tại Kira Art. Dùng 1 lần, không dùng chung với phiếu quà khác.",alt:"Voucher giảm 10%"},
{id:"p20",label:"20%",short:"Voucher 20%",stock:3,w:5,fill:"#6E3B82",text:"#FDD835",title:"Bạn trúng voucher 20%!",desc:"Áp dụng cho tất cả các khóa học tại Kira Art.",alt:"Voucher giảm 20%"}
];
const KEY="kira-wheel-stock-v1";
const initial=()=>Object.fromEntries(PRIZES.map(p=>[p.id,p.stock]));
let stock=initial();
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&PRIZES.every(p=>Number.isInteger(s[p.id])))stock=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(stock))}catch(e){}};

const $=id=>document.getElementById(id);
const wheel=$("wheel"),wheelBox=$("wheelBox"),spinBtn=$("spin"),msg=$("msg");
const R=190,C=200;
const pt=(deg,r)=>{const a=deg*Math.PI/180;return[C+r*Math.sin(a),C-r*Math.cos(a)]};
let svg='<circle cx="200" cy="200" r="197" fill="#fff"/>';
PRIZES.forEach((p,i)=>{
  const a0=i*90,a1=a0+90,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),mid=a0+45,[tx,ty]=pt(mid,125);
  svg+=`<path d="M${C} ${C}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${p.fill}" stroke="#fff" stroke-width="4"/>`;
  const big=p.id==="k"?"":"font-size:50px";
  svg+=`<g transform="translate(${tx} ${ty}) rotate(${mid})" fill="${p.text}" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-weight="800">`+
    (p.id==="k"?`<text y="-4" font-size="30">Móc</text><text y="26" font-size="30">khóa</text>`:`<text y="14" font-size="50">${p.label}</text>`)+`</g>`;
});
wheel.innerHTML=svg;

function renderStock(){
  $("stock").innerHTML=PRIZES.map(p=>`<li class="${stock[p.id]<=0?"out":""}"><span>${p.short}</span><b>${stock[p.id]}</b></li>`).join("");
  const left=PRIZES.some(p=>stock[p.id]>0);
  spinBtn.disabled=!left;
  if(!left)msg.textContent="Đã hết quà. Bấm “Đặt lại kho quà” để bắt đầu lại.";
}
function pick(){
  const av=PRIZES.filter(p=>stock[p.id]>0);
  let r=Math.random()*av.reduce((s,p)=>s+p.w,0);
  for(const p of av){if((r-=p.w)<0)return p}
  return av[av.length-1];
}
let rot=0,busy=false;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
spinBtn.addEventListener("click",()=>{
  if(busy)return;
  const p=pick();if(!p)return;
  busy=true;spinBtn.disabled=true;msg.textContent="Đang quay…";
  const i=PRIZES.indexOf(p),offset=(Math.random()-.5)*60; // lệch ngẫu nhiên trong ô
  const targetMod=((-(i*90+45+offset))%360+360)%360;
  const delta=((targetMod-rot%360)+360)%360;
  rot+=(reduce?1:5)*360+delta;
  wheelBox.style.webkitTransform=wheelBox.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{
    stock[p.id]--;save();renderStock();
    $("dt").textContent=p.title;$("dd").textContent=p.desc;
    const im=$("di");im.src=IMG[p.id];im.alt=p.alt;
    $("dlg").showModal();
    msg.textContent="";busy=false;
    if(PRIZES.some(q=>stock[q.id]>0))spinBtn.disabled=false;
  },reduce?1300:5300);
});
$("close").addEventListener("click",()=>$("dlg").close());
$("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
let armed=false;
$("reset").addEventListener("click",e=>{
  if(!armed){armed=true;e.target.textContent="Bấm lần nữa để xác nhận đặt lại";setTimeout(()=>{armed=false;e.target.textContent="Đặt lại kho quà"},3500);return}
  armed=false;stock=initial();save();msg.textContent="";e.target.textContent="Đặt lại kho quà";renderStock();
});
renderStock();
</script>
